<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>Chromatic Arcade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%221%22 y=%2214%22 font-size=%2214%22>&#127918;</text></svg>">
  <link rel="stylesheet" href="https://nickcottrell.github.io/haberdash/haberdash.css">
  <link rel="stylesheet" href="css/arcade.css?v=4">
</head>
<body>
  <main class="arcade">

    <!-- Picker (Haberdash) -->
    <section id="picker" class="picker">
      <header class="arcade-masthead">
        <h1 class="arcade-masthead__title font-3xl font-bold">Chromatic Arcade</h1>
        <p class="arcade-masthead__tagline font-sm" id="arcade-tagline">Loading&hellip;</p>
      </header>
      <div id="game-grid" class="grid grid--2 gap-md"></div>
    </section>

    <!-- Cabinet (one game at a time) -->
    <section id="cabinet" class="cabinet" hidden>
      <div class="cabinet-bar">
        <button id="back-btn" class="back-btn" type="button" aria-label="Back to menu">&lsaquo; Menu</button>
        <span id="cabinet-title" class="cabinet-bar__title"></span>
        <span class="cabinet-bar__score"><span class="label">Score</span><span id="score-value">0</span></span>
      </div>
      <div id="surface" class="surface"></div>
      <div id="stat-row" class="stat-row"></div>
      <div id="control-pad" class="control-pad"></div>
    </section>

  </main>
  <!-- chess.js 0.10.3 vendored (top-level `var Chess` -> global) -- the legality
       referee for the Chess port. Vendored so there's no CDN/ESM ambiguity. -->
  <script src="js/vendor/chess.js"></script>
  <script src="js/shell.js?v=4"></script>
</body>
</html>
