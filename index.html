<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>Arcade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text x=%221%22 y=%2214%22 font-size=%2214%22>&#127918;</text></svg>">
  <link rel="stylesheet" href="https://nickcottrell.github.io/haberdash/haberdash.css">
  <link rel="stylesheet" href="css/arcade.css?v=8">
  <!-- Live Haberdash/Spectra theme -- the single source of truth shared with
       Line One. The loader fetches the haberdash-ui-theme node, resolves it via
       the Spectra builder, and injects concrete tokens here (last -> wins). -->
  <style id="vrgb-tokens"></style>
  <script src="js/spectra-theme-loader.js?v=5"></script>
</head>
<body>
  <main class="arcade">

    <!-- Picker: just the games. Thin chrome, content-first. -->
    <section id="picker" class="picker">
      <div id="game-grid" class="grid gap-md"></div>
    </section>

  </main>
  <!-- The launcher opens each game in its own window (game.html?id=...). -->
  <script src="js/sfx.js?v=1"></script>
  <script src="js/shell.js?v=7"></script>
</body>
</html>
